name: Build & deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Пересборка раз в сутки -- подхватываем правки в sources.avar.me
  schedule:
    - cron: "37 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System deps (ICU for Aard2/QuickDic sorting, marisa-trie for Kobo)
        run: sudo apt-get update && sudo apt-get install -y libicu-dev pkg-config

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Build site
        timeout-minutes: 40
        run: ./build.sh

      - name: Add CNAME
        run: cp CNAME docs/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
